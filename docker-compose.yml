version: "3.9"

services:
  db:
    image: postgres:16
    container_name: re_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: rewuser
      POSTGRES_PASSWORD: rewpass
      POSTGRES_DB: real_estate
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rewuser -d real_estate"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # nominatim:
  #   image: mediagis/nominatim:4.3
  #   container_name: nominatim
  #   restart: unless-stopped
  #   # First run: import BC extract from Geofabrik
  #   environment:
  #     # BC-only extract to keep size down
  #     PBF_URL: "https://download.geofabrik.de/north-america/canada/british-columbia-latest.osm.pbf"
  #     IMPORT_WIKIPEDIA: "false"
  #     USE_US_TIGER_DATA: "false"
  #     POSTGRES_SHARED_BUFFERS: "512MB"
  #     POSTGRES_MAINTENANCE_WORK_MEM: "256MB"
  #   volumes:
  #     - nominatim_data:/var/lib/postgresql/14/main
  #   ports:
  #     - "8080:8080"
  #   healthcheck:
  #     test: ["CMD-SHELL", "curl -sf http://localhost:8080/search?q=vancouver&format=json&limit=1 || exit 1"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 10
  #     start_period: 120s   # give it time to import on first run

  rew_scraper:
    build:
      context: ./scraper
    container_name: rew_scraper
    init: true
    shm_size: '2gb'
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://rewuser:rewpass@db:5432/real_estate
    command: ["python", "rew_detail_scraper.py"]
  
  rew_discoverer:
    build:
      context: ./scraper
    container_name: rew_discoverer
    init: true
    shm_size: '2gb'
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://rewuser:rewpass@db:5432/real_estate
    command: ["python", "rew_discover_worker.py"]

  bc_assessment_scraper:
    build:
      context: ./scraper
    container_name: bc_assessment_scraper
    init: true
    shm_size: '2gb'
    depends_on:
      db:
        condition: service_healthy
      # nominatim:
      #   condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://rewuser:rewpass@db:5432/real_estate
      GEOCODER_URL: http://nominatim:8080/search
    command: ["python", "bc_assessment_worker.py"]
  
  rew_insights_scraper:
    build:
      context: ./scraper
    container_name: rew_insights_scraper
    init: true
    shm_size: '2gb'
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://rewuser:rewpass@db:5432/real_estate
    command: ["python", "rew_insights_worker.py"]


  webapp:
    build:
      context: ./webapp
    container_name: re_webapp
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://rewuser:rewpass@db:5432/real_estate
    ports:
      - "8000:8000"
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000"]

volumes:
  db_data:
  # nominatim_data:

