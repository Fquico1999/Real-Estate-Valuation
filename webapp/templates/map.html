<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Listings Map</title>

  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
    <!-- Leaflet MarkerCluster CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"
  />
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"
  />

  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      margin: 0;
      padding: 0;
    }
    .top-bar {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid #ddd;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .top-bar a {
      text-decoration: none;
      color: #0070f3;
    }
    .filters-bar {
      padding: 0.5rem 1rem;
      border-bottom: 1px solid #eee;
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      align-items: center;
      background: #fafafa;
      font-size: 0.9rem;
    }
    .filters-bar label {
      display: flex;
      flex-direction: column;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      color: #555;
    }
    .filters-bar input {
      padding: 0.25rem 0.4rem;
      font-size: 0.9rem;
      min-width: 6rem;
    }
    .filters-bar button {
      padding: 0.4rem 0.8rem;
      font-size: 0.9rem;
      border-radius: 4px;
      border: 1px solid #0070f3;
      background: #0070f3;
      color: white;
      cursor: pointer;
    }
    .filters-bar button.secondary {
      border-color: #ccc;
      background: white;
      color: #333;
      margin-left: 0.25rem;
    }
    #map {
      height: calc(100vh - 48px - 46px); /* top bar + filters bar */
      width: 100%;
    }
    @media (max-width: 600px) {
      #map {
        height: calc(100vh - 48px - 72px);
      }
    }
  </style>
</head>
<body>
  <div class="top-bar">
    <div>
      <strong>Listings Map</strong>
    </div>
    <div>
      <a href="{{ request.url_for('listings') }}">← Back to list</a>
      &nbsp;|&nbsp;
      <a href="{{ request.url_for('home') }}">Dashboard</a>
    </div>
  </div>
  <!-- Filters -->
  <form class="filters-bar" method="get" action="{{ request.url_for('map_view') }}">
    <label>
      Min Price
      <input
        type="number"
        name="min_price"
        min="0"
        step="50000"
        value="{{ min_price if min_price is not none else '' }}"
        placeholder="e.g. 800000"
      />
    </label>
    <label>
      Max Price
      <input
        type="number"
        name="max_price"
        min="0"
        step="50000"
        value="{{ max_price if max_price is not none else '' }}"
        placeholder="e.g. 1500000"
      />
    </label>
    <label>
      Min Beds
      <input
        type="number"
        name="min_beds"
        min="0"
        step="1"
        value="{{ min_beds if min_beds is not none else '' }}"
        placeholder="e.g. 2"
      />
    </label>
    <label>
      Min Baths
      <input
        type="number"
        name="min_baths"
        min="0"
        step="1"
        value="{{ min_baths if min_baths is not none else '' }}"
        placeholder="e.g. 2"
      />
    </label>

    <div>
      <button type="submit">Apply</button>
      <button
        type="button"
        class="secondary"
        onclick="window.location='{{ request.url_for('map_view') }}'"
      >
        Reset
      </button>
    </div>
  </form>

  <div id="map"></div>

  <!-- Leaflet JS -->
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <!-- Leaflet MarkerCluster JS -->
  <script
    src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"
  ></script>


  <script>
    // Data from backend
    const listingPoints = {{ listing_points | tojson }};

    // Listing ID to focus (if any)
    const focusId = {{ focus_id if focus_id is not none else 'null' }};

    // Default center (Vancouver-ish) if no data:
    let defaultCenter = [49.2827, -123.1207];
    if (listingPoints.length > 0) {
      // Start at the first listing; we'll also fit bounds below
      defaultCenter = [listingPoints[0].lat, listingPoints[0].lng];
    }

    // Initialize map
    const map = L.map("map").setView(defaultCenter, 12);

    // Base tile layer from OpenStreetMap
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);

    // Create a marker cluster group
    const clusterGroup = L.markerClusterGroup({
      chunkedLoading: true,
      chunkDelay: 20,   // ms between chunks
      chunkSize: 1000,   // markers per batch
    });

    // Keep a lookup from listing id -> marker
    const markerById = new Map();

    // Layer group for property bounding boxes
    const propertyBboxLayer = L.layerGroup().addTo(map);

    // Debounce helper
    function debounce(fn, delay) {
      let timeout;
      return (...args) => {
        clearTimeout(timeout);
        timeout = setTimeout(() => fn(...args), delay);
      };
    }

    function addListingMarker(item) {
      if (item.lat == null || item.lng == null) return;

      const price = item.price
        ? "$" + item.price.toLocaleString()
        : "Price unknown";

      const detailsParts = [];
      if (item.beds != null) detailsParts.push(`${item.beds} bd`);
      if (item.baths != null) detailsParts.push(`${item.baths} ba`);
      if (item.sqft != null) detailsParts.push(`${item.sqft.toLocaleString()} sqft`);
      const detailsLine = detailsParts.join(" • ");

      const popupHtml = `
          <div>
            <strong>${price}</strong><br/>
            ${detailsLine ? detailsLine + "<br/>" : ""}
            ${item.address ? item.address : "No address"}<br/>
            ${item.city || ""} ${item.neighbourhood || ""}<br/>
            ${item.url ? `<a href="${item.url}" target="_blank" rel="noopener noreferrer">View on REW</a>` : ""}
            <br/>
          </div>
        `;

      const marker = L.marker([item.lat, item.lng]).bindPopup(popupHtml);
      const label = `${price} – ${item.city || ""} ${item.neighbourhood || ""}`.trim();
      marker.bindTooltip(label, { direction: "top" });

      clusterGroup.addLayer(marker);
      markerById.set(item.id, marker);
    }

    // Fetch listings for current map bounds
    async function loadListingsForBounds() {
      const bounds = map.getBounds();
      const zoom = map.getZoom();

      const params = new URLSearchParams({
        min_lat: bounds.getSouth(),
        max_lat: bounds.getNorth(),
        min_lng: bounds.getWest(),
        max_lng: bounds.getEast(),
        zoom: zoom,
        min_price: document.querySelector('input[name="min_price"]').value || "",
        max_price: document.querySelector('input[name="max_price"]').value || "",
        min_beds: document.querySelector('input[name="min_beds"]').value || "",
        min_baths: document.querySelector('input[name="min_baths"]').value || "",
      });

      const resp = await fetch(`/api/map/listings?${params.toString()}`);
      if (!resp.ok) {
        console.error("Failed to load listings");
        return;
      }

      const data = await resp.json();

      // Reset and add new markers
      clusterGroup.clearLayers();
      markerById.clear();

      data.listings.forEach(addListingMarker);
    }

    const BBOX_MIN_ZOOM = 15;

    function addPropertyBbox(prop) {
      if (!prop.bbox) return;

      const { south, north, west, east } = prop.bbox;
      if (
        south == null ||
        north == null ||
        west == null ||
        east == null
      ) {
        return;
      }

      const bounds = [
        [south, west],
        [north, east],
      ];

      const addressLine = prop.address || "Unnamed Property";
      const locationLine = [prop.city, prop.postal_code].filter(Boolean).join(" ");

      // Property details URL (assuming you have such a route)
      const detailUrl = `/properties/${prop.id}`;

      const popupHtml = `
        <div style="font-size: 14px; line-height: 1.3;">
          <strong>${addressLine}</strong><br/>
          ${locationLine ? locationLine + "<br/><br/>" : "<br/>"}
          <a href="${detailUrl}" target="_blank" rel="noopener noreferrer">
            View Property Details
          </a>
        </div>
      `;

      const rect = L.rectangle(bounds, {
        weight: 1,
        fillOpacity: 0.1,
      }).bindPopup(popupHtml);

      propertyBboxLayer.addLayer(rect);
    }

    // Fetch property bounding boxes for current map bounds
    async function loadPropertyBboxesForBounds() {
      const bounds = map.getBounds();
      const zoom = map.getZoom();

      // Only load when zoomed in enough
      if (zoom < BBOX_MIN_ZOOM) {
        propertyBboxLayer.clearLayers();
        return;
      }

      const params = new URLSearchParams({
        min_lat: bounds.getSouth(),
        max_lat: bounds.getNorth(),
        min_lng: bounds.getWest(),
        max_lng: bounds.getEast(),
        zoom: zoom,
      });

      const resp = await fetch(`/api/map/properties/bboxes?${params.toString()}`);
      if (!resp.ok) {
        console.error("Failed to load property bboxes");
        return;
      }

      const data = await resp.json();

      propertyBboxLayer.clearLayers();
      (data.properties || []).forEach(addPropertyBbox);
    }
    
    listingPoints.forEach(addListingMarker);

    // Add the cluster group to the map
    map.addLayer(clusterGroup);

    // Fit bounds for all clustered markers
    if (clusterGroup.getLayers().length > 0) {
      map.fitBounds(clusterGroup.getBounds().pad(0.2));
    }
    // If a focusId was provided, zoom to that marker and open its popup
    if (focusId !== null) {
      const targetMarker = markerById.get(focusId);
      if (targetMarker) {
        clusterGroup.zoomToShowLayer(targetMarker, () => {
          targetMarker.openPopup();
        });
      }
    }
    // Load new listings when the map stops moving
    //const debouncedLoad = debounce(loadListingsForBounds, 300);
    //map.on("moveend", debouncedLoad);

    // Trigger once on page load
    //debouncedLoad();

    // Load property bounding boxes when the map stops moving
    const debouncedBboxLoad = debounce(loadPropertyBboxesForBounds, 300);
    map.on("moveend", debouncedBboxLoad);

    // Trigger once on page load
    debouncedBboxLoad();
  </script>
</body>
</html>
